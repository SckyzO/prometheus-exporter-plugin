# Plugin CI - the anti-bit-rot gate for THIS repo (the prometheus-exporter
# plugin itself). Distinct from skills/prometheus-exporter/assets/.github/
# workflows/ci.yml.tmpl, which ships INSIDE every scaffolded exporter and
# lints/builds/tests THAT repo - this file guards the scaffolder that
# produces it. Four independent gates:
#
#   - claude-plugin-validate: the manifest is actually a valid Claude Code
#     plugin (falls back to a jq structural check if the CLI can't be
#     installed - see that job's own step comments).
#   - zero-source-grep: this plugin's taught knowledge must never leak the
#     reference project's name, and the maintainer's personal handle must
#     stay out of the taught skill/command/agent content specifically - see
#     test/zero-source-grep.sh (which this job just calls) for exactly what
#     that checks and why, and CLAUDE.md's Zero-source-mention rule for the
#     policy itself. Deliberately extracted into that script rather than
#     inlined in this YAML: this workflow file would otherwise have to
#     spell out the literal reference-project name it's checking for,
#     tripping the very gate it runs (the same self-reference problem
#     test/golden-smoke.sh's own detector already needed an exemption for).
#   - scaffold-unit-tests: the fast, Go-free, network-free unit suites for
#     scaffold.sh itself, including its --target-model single|multi axis
#     (test/scaffold_multitarget_test.sh).
#   - golden-smoke: the full {http,cli} x {none,github} matrix, plus an
#     http-multi and an http-multi-instance cell - scaffolds a real exporter
#     and runs each through make build/check, promtool, a guarded docker
#     build, the docs-check lie-injection round-trip, and (multi and
#     multi-instance only) live requests against the running binary. Gated
#     behind scaffold-unit-tests: no reason to burn several minutes of Docker
#     builds on six full scaffolds if scaffold.sh itself is already known
#     broken by its own cheap unit tests.
#
#     Run as a JOB MATRIX, one runner per cell, rather than as a single
#     runner looping over test/golden-smoke.sh --all. The script's own loop
#     is sequential on purpose (every cell shares one tools-image tag and
#     would race on it, see its comment), but that is a property of one
#     machine: six runners have six Docker daemons and nothing to race on.
#     Sequentially the job took 24m43s while every other job here finishes
#     under twenty seconds, so the whole pipeline's latency was this one job.
#     --all is untouched and remains the local entry point. See
#     docs/design/2026-07-28-golden-smoke-ci-matrix-design.md.
#
# Every job needs nothing beyond what ubuntu-latest ships out of the box
# (git, make, docker, jq) plus, for claude-plugin-validate, a
# network-reachable install script - no actions/setup-* step anywhere, and
# only ONE third-party action in this entire file (actions/checkout).

name: Plugin CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Weekly watchdog: golden-smoke scaffolds a real exporter and runs its
  # `make check`, which includes govulncheck@latest against a fresh vuln DB.
  # The exporter's Go toolchain, base-image digests and dependencies are
  # TEMPLATED (go.mod.tmpl, Dockerfile.tmpl, ...) so Dependabot can't see them;
  # this schedule surfaces a newly-published vulnerability in those pinned
  # template versions without waiting for a commit (e.g. GO-2026-5856).
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  claude-plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Native, non-interactive installer - the method code.claude.com/docs
      # documents for exactly this case ("Install Claude Code Natively").
      # Never allowed to fail the STEP itself: if the install fails
      # (offline mirror, transient network), the next step's own
      # `command -v claude` check falls back instead of this job dying here
      # on a confusing curl/bash trace.
      - name: Install Claude Code CLI (best-effort)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash || echo "::warning::native Claude Code install failed - claude-plugin-validate will fall back to the jq structural check"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `claude plugin validate --strict` is a pure local manifest check -
      # no ANTHROPIC_API_KEY / login needed (verified while writing this
      # workflow: it passes with HOME pointed at an empty, credential-free
      # directory). When the CLI genuinely isn't installable in this
      # runner, fall back to a jq-based shape check of .claude-plugin/*.json
      # - strictly weaker (it cannot catch a field the real validator would
      # reject, only gross structural breakage: not JSON, not an object,
      # missing a required key) - and say so out loud via ::warning:: rather
      # than silently reporting green on a check that didn't really run.
      - name: claude plugin validate (jq fallback if CLI unavailable)
        run: |
          set -eu
          if command -v claude >/dev/null 2>&1 && claude --version >/dev/null 2>&1; then
            echo "claude CLI available ($(claude --version)); running the real validator"
            claude plugin validate . --strict
          else
            echo "::warning::claude CLI not available in this runner after the documented native install - falling back to a jq structural check of .claude-plugin/*.json. This is NOT equivalent to 'claude plugin validate .': it only confirms the manifests are valid JSON objects carrying the fields the schema requires, not full schema/semantic validation."
            command -v jq >/dev/null 2>&1 || { echo "::error::jq not found either - cannot run even the fallback check" >&2; exit 1; }
            jq -e 'type == "object" and (.name|type=="string") and (.description|type=="string") and (.author.name|type=="string") and (.license|type=="string")' .claude-plugin/plugin.json >/dev/null \
              || { echo "::error::.claude-plugin/plugin.json failed the fallback structural check" >&2; exit 1; }
            jq -e 'type == "object" and (.name|type=="string") and (.owner.name|type=="string") and (.plugins|type=="array") and (.plugins|length > 0)' .claude-plugin/marketplace.json >/dev/null \
              || { echo "::error::.claude-plugin/marketplace.json failed the fallback structural check" >&2; exit 1; }
            echo "jq structural fallback check passed"
          fi

  zero-source-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: repo-wide zero-source-leak gates (see test/zero-source-grep.sh)
        run: sh test/zero-source-grep.sh

  scaffold-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scaffold.sh unit + edge-case tests (no Go, no network)
        run: |
          sh test/scaffold_test.sh
          sh test/scaffold_edge_test.sh
          sh test/scaffold_multitarget_test.sh

      # Drift guard for golden-smoke's matrix. A workflow cannot read a shell
      # variable, so the matrix below repeats the cell list that
      # test/golden-smoke.sh owns (its MATRIX_CELLS). Without this assertion,
      # adding a cell to the script and forgetting the workflow would mean CI
      # silently stops covering it, and a silent gap in a gate is worse than a
      # missing gate. Lives in THIS job, which costs seven seconds, so a drift
      # is reported before the matrix burns six runners.
      - name: golden-smoke matrix matches the script's cell list
        run: |
          set -eu
          workflow=$(grep -oE '\{ *cell: [a-z-]+' .github/workflows/plugin-ci.yml | sed 's/.*cell: //' | sort)
          script=$(sh test/golden-smoke.sh --list-cells | sort)
          if [ "$workflow" != "$script" ]; then
            echo "::error::golden-smoke's matrix and test/golden-smoke.sh --list-cells disagree"
            printf 'workflow matrix:\n%s\n\nscript --list-cells:\n%s\n' "$workflow" "$script" >&2
            exit 1
          fi
          printf 'golden-smoke matrix matches --list-cells:\n%s\n' "$script"

  probe-backbone-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: live-probe redaction backbone unit test (no Go, no network)
        run: sh test/probe-target-backbone.sh

  # Counterpart to probe-backbone-test above. golden-smoke exercises the
  # dashboard BACKBONE (skills/.../scripts/generate-dashboard.sh) against a
  # freshly scaffolded repo, but nothing invoked this suite, which is the
  # backbone's own unit tests: the parser, the namespace reader, uid
  # stability, slug-collision refusals and the zero-metric exit 3. A test
  # that never runs is not coverage. Needs jq, preinstalled on ubuntu-latest.
  dashboard-backbone-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: dashboard backbone unit tests (no Go, no network)
        run: sh test/generate-dashboard-backbone.sh

  golden-smoke:
    needs: scaffold-unit-tests
    runs-on: ubuntu-latest
    name: golden-smoke (${{ matrix.cell }})
    strategy:
      # One broken cell must not hide the state of the other five: that is
      # what --all does deliberately today (it runs every cell and reports
      # them together), and fail-fast would silently drop that property.
      fail-fast: false
      # Static list, never fromJSON: a generated matrix that comes back empty
      # produces a job that succeeds without running anything, which reads as
      # green. A literal list cannot be empty. It is kept honest against
      # test/golden-smoke.sh by the drift guard in scaffold-unit-tests above,
      # so keep "cell:" first in each entry, which is what that guard greps.
      matrix:
        include:
          - {cell: http-none, flavor: http, forge: none, target_model: single}
          - {cell: http-github, flavor: http, forge: github, target_model: single}
          - {cell: cli-none, flavor: cli, forge: none, target_model: single}
          - {cell: cli-github, flavor: cli, forge: github, target_model: single}
          - {cell: http-multi, flavor: http, forge: none, target_model: multi}
          - {cell: http-multi-instance, flavor: http, forge: none, target_model: multi-instance}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: golden smoke cell - scaffold, build, check, promtool, docker
        env:
          FLAVOR: ${{ matrix.flavor }}
          FORGE: ${{ matrix.forge }}
          TARGET_MODEL: ${{ matrix.target_model }}
        run: sh test/golden-smoke.sh --flavor "$FLAVOR" --forge "$FORGE" --target-model "$TARGET_MODEL"
